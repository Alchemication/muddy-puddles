<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muddy Puddles</title>
<style>
  :root {
    --sky: #8fd3ff;
    --grass: #6cc24a;
    --card: #ffffff;
    --card-edge: #c9c9c9;
    --focus: #ffd23f;
    --text: #2b2b2b;
    --muted: #5b6770;
    --pink: #f7a1c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(var(--sky) 60%, var(--grass) 60%) fixed;
    color: var(--text);
    font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", system-ui, sans-serif;
    padding: 5vh 16px;
  }
  h1 { font-size: clamp(32px, 7vw, 64px); text-align: center; margin: 0 0 1vh; }
  .sub { text-align: center; font-size: clamp(16px, 2.4vw, 22px); margin: 0 0 4vh; color: var(--muted); }
  #models {
    list-style: none; margin: 0 auto; padding: 0; max-width: 1100px;
    display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  #models a {
    display: flex; align-items: center; gap: 12px; height: 100%; padding: 16px 20px;
    background: var(--card); color: inherit; text-decoration: none;
    border-radius: 20px; box-shadow: 0 6px 0 var(--card-edge);
    transition: transform .1s, background .1s;
    outline: none;
  }
  #models a:hover, #models a:focus-visible { background: var(--focus); transform: translateY(-4px); }
  .pig { font-size: 36px; line-height: 1; }
  .name { font-size: 22px; font-weight: bold; }
  /* How the game was made: single-shot (one prompt) or optimised (refined in follow-ups). */
  .tag {
    display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 999px;
    font-size: 13px; font-weight: bold; white-space: nowrap;
  }
  .tag.single-shot { background: #dff0ff; color: #2d5d85; }
  .tag.optimised { background: #fde3ee; color: #8a3a5c; }
  footer { text-align: center; margin-top: 6vh; font-size: 16px; }
  footer a { color: var(--text); }
</style>
</head>
<body>
  <h1>🐷 Muddy Puddles</h1>
  <p class="sub">Pick a model to play</p>
  <ul id="models"></ul>
  <footer><a href="https://github.com/Alchemication/muddy-puddles/blob/main/PROMPT.md">The prompt behind every game</a></footer>

<script>
  // To add a model: put its game in models/<folder>/index.html and add one line here.
  // tag: "single-shot" (made from the prompt in one go) or "optimised" (refined in follow-ups).
  const MODELS = [
    { folder: "claude-opus-5-5", name: "Claude Opus 5.5", tag: "optimised" },
  ];

  const list = document.getElementById("models");
  for (const m of MODELS) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = `models/${m.folder}/index.html`;
    const el = (cls, text) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; return d; };
    const info = document.createElement("div");
    info.append(el("name", m.name), el(`tag ${m.tag}`, m.tag));
    a.append(el("pig", "🐷"), info);
    li.append(a);
    list.append(li);
  }

  // Arrow keys move between models, Enter opens one (fitting, for an arrow-key game).
  const links = [...list.querySelectorAll("a")];
  links[0]?.focus();
  document.addEventListener("keydown", e => {
    const i = links.indexOf(document.activeElement);
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!step) return;
    e.preventDefault();
    links[(Math.max(i, 0) + step + links.length) % links.length].focus();
  });
</script>
</body>
</html>
