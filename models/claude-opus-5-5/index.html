<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Peppa's Muddy Puddles</title>
<style>
  :root {
    --sky: #8fd3ff;
    --grass: #6cc24a;
    --grass-dot: #7fd35c;
    --mud: #7a4a1e;
    --mud-light: #a0662f;
    --key: #ffffff;
    --key-on: #ffd23f;
    --key-edge: #c9c9c9;
    --text: #2b2b2b;
    --pink: #f7a1c4;
    --pink-dark: #ef6f9f;
    --dress: #e0282f;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    /* Phones: no scrolling, zooming or pull-to-refresh, so swipes only move Peppa. */
    touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none;
    background: var(--sky); color: var(--text);
    transition: background-color 3s;
    font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- Sky ---------- */
  #sky {
    flex: 0 0 16vh; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 3vw;
  }
  #sun {
    position: absolute; left: 3vw; top: 2vh;
    width: 11vh; height: 11vh; border-radius: 50%;
    background: #ffe04a; box-shadow: 0 0 0 1.5vh #fff2a8;
  }
  #music {
    position: absolute; left: 17vh; top: 4vh; z-index: 2;
    width: 7vh; height: 7vh; border: none; border-radius: 50%;
    background: rgba(255,255,255,.6); font-size: 3.5vh; cursor: pointer;
  }
  #music.muted { opacity: .35; }
  #message { position: relative; z-index: 2; font-size: 6vh; font-weight: bold; text-align: center; }
  #stars { position: absolute; z-index: 2; right: 3vw; top: 3vh; font-size: 7vh; letter-spacing: .5vw; }
  .star { display: inline-block; animation: pop .5s ease-out; }

  /* ---------- Weather ----------
     Moves one step after each puddle: sunny → cloudy → rain → rainbow → sunny.
     Everything fades slowly so it never distracts from the game. */
  body[data-weather="cloudy"]  { --sky: #a9c9dd; }
  body[data-weather="rain"]    { --sky: #9db4c4; --grass: #5ca83f; --grass-dot: #6bb84c; }
  body[data-weather="rainbow"] { --sky: #99d7ff; --grass: #66bf46; --grass-dot: #78cd57; }
  #sun { transition: opacity 3s, filter 3s; }
  body[data-weather="rain"] #sun { opacity: .45; filter: saturate(.5); }
  .cloud {
    position: absolute; left: 0; z-index: 1; pointer-events: none;
    animation: drift linear infinite;
    transition: opacity 3s, filter 3s;
  }
  .cloud svg { width: 100%; height: auto; display: block; }
  .cloud.extra { opacity: 0; }
  body[data-weather="cloudy"] .cloud.extra, body[data-weather="rain"] .cloud.extra { opacity: .95; }
  body[data-weather="rain"] .cloud { filter: brightness(.9); }
  #suncloud {
    position: absolute; left: calc(3vw + 2vh); top: 5vh; width: 15vh; z-index: 1;
    opacity: 0; transition: opacity 3s, filter 3s;
  }
  body[data-weather="cloudy"] #suncloud { opacity: .9; }
  body[data-weather="rain"] #suncloud { opacity: 1; filter: brightness(.9); }
  #rainbow {
    position: absolute; left: 50%; bottom: -1vh; width: 56vw; height: 15vh;
    transform: translateX(-50%); z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 50% 100% at 50% 100%,
      transparent 72%, #c39bff 72% 76%, #7cc0ff 76% 80%, #8fd694 80% 84%,
      #fff38a 84% 88%, #ffc27a 88% 92%, #ff9a9a 92% 96%, transparent 96%);
    opacity: 0; transition: opacity 4s;
  }
  body[data-weather="rainbow"] #rainbow { opacity: .55; }
  #rain {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    opacity: 0; transition: opacity 2.5s;
  }
  body[data-weather="rain"] #rain { opacity: 1; }
  .raindrop {
    position: absolute; top: -6vh; width: .35vh; height: 3.5vh; border-radius: .2vh;
    background: rgba(255, 255, 255, .55);
    animation: fall linear infinite;
  }
  @keyframes drift { from { transform: translateX(-25vw); } to { transform: translateX(110vw); } }
  @keyframes fall { to { transform: translate(-4vh, 95vh); } }

  /* ---------- Main area ---------- */
  #main { flex: 1; display: flex; min-height: 0; }
  #field {
    flex: 1; position: relative; overflow: hidden;
    background: var(--grass);
    border-top-right-radius: 4vh;
    transition: background-color 3s;
  }
  .tile {
    position: absolute; border-radius: 50%;
    background: var(--grass-dot);
    transition: background-color 3s;
  }
  #puddle {
    position: absolute; transition: opacity .3s;
  }
  #puddle svg, #peppa svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #peppa {
    position: absolute; z-index: 2;
    transition: left .35s ease-in-out, top .35s ease-in-out;
  }
  #peppa .flip { width: 100%; height: 100%; transition: transform .2s; }
  #peppa.left .flip { transform: scaleX(-1); }
  #peppa .bounce, #peppa .alive { width: 100%; height: 100%; }

  /* Peppa's little movements. Each part turns around its own joint. */
  #peppa g { transform-box: fill-box; }
  #peppa .alive { animation: breathe 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
  #peppa .eyes { transform-origin: 50% 50%; animation: blink 4.5s infinite; }
  #peppa .tail { transform-origin: 100% 60%; animation: tailwag 1.8s ease-in-out infinite; }
  #peppa .leg { transform-origin: 50% 0%; }
  #peppa .arm.back { transform-origin: 100% 100%; }
  #peppa .arm.front { transform-origin: 0% 100%; }
  #peppa .head { transform-origin: 40% 100%; transition: transform .6s; }
  #peppa .mud { opacity: 0; transition: opacity 2.5s; }
  #peppa.muddy .mud { opacity: .9; transition: opacity .2s; }
  /* Walking: a small hop and swinging legs. */
  #peppa.walking .alive { animation: hop .35s ease-out; }
  #peppa.walking .leg.front { animation: swing .35s ease-in-out; }
  #peppa.walking .leg.back { animation: swing .35s ease-in-out reverse; }
  /* Stuck: point and wave toward the puddle. */
  #peppa.pointing .arm.front { animation: wave 1s ease-in-out infinite; }
  /* After a splash: arms up and a happy bounce. */
  #peppa.cheer .arm.back { animation: cheerBack .4s ease-in-out 3 alternate; }
  #peppa.cheer .arm.front { animation: cheerFront .4s ease-in-out 3 alternate; }
  /* In the rain, she looks up at the sky now and then. */
  body[data-weather="rain"] #peppa .head { animation: lookup 7s ease-in-out infinite; }
  #peppa.jump .bounce { animation: jump .6s ease-out; }
  #peppa.bump .bounce { animation: wiggle .35s ease-in-out; }

  /* Splash: the puddle squishes, ripples spread out, mud drops arc up and fall back. */
  #puddle.squish svg { animation: squish .45s ease-out; transform-origin: 50% 60%; }
  /* The puddle follows the weather: darker when cloudy, fuller in the rain,
     a faint rainbow sheen after it. */
  #puddle .water { transform-box: fill-box; transform-origin: 50% 50%; transition: transform 3s; }
  #puddle .mudpool { transition: fill 3s; }
  #puddle .sheen { opacity: 0; transition: opacity 3s; }
  body[data-weather="cloudy"] { --mud: #6e4219; }
  body[data-weather="rain"] { --mud: #6a4520; }
  body[data-weather="rain"] #puddle .water { transform: scale(1.18); }
  body[data-weather="rainbow"] #puddle .sheen { opacity: .3; animation: shimmer 3s ease-in-out infinite; }
  .rainring {
    position: absolute; z-index: 1; border-radius: 50%; pointer-events: none;
    border: .3vh solid rgba(255, 255, 255, .55);
    animation: ripple .6s ease-out forwards;
  }
  .drop.wet { background: #9fb3c2; }
  .drop.rainbow { box-shadow: 0 0 .8vh currentColor; }
  .twinkle {
    position: absolute; z-index: 3; pointer-events: none; line-height: 1;
    animation: twinkle .9s ease-out forwards;
  }
  .ripple {
    position: absolute; z-index: 1; border-radius: 50%;
    border: .5vh solid var(--mud-light);
    animation: ripple .9s ease-out forwards;
  }
  .drop {
    position: absolute; z-index: 3; border-radius: 50%;
    background: var(--mud-light);
    animation: arc .75s forwards;
  }

  /* ---------- Keys panel ---------- */
  #keys {
    flex: 0 0 30vw; display: flex; align-items: center; justify-content: center;
  }
  .pad {
    display: grid; gap: 1.2vw;
    grid-template-columns: repeat(3, 8.5vw);
    grid-template-rows: repeat(2, 8.5vw);
    grid-template-areas: ". up ." "left down right";
  }
  .key {
    border: none; border-radius: 1.6vw;
    background: var(--key); color: var(--text);
    box-shadow: 0 .7vw 0 var(--key-edge);
    font-size: 4.5vw; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .08s, background .08s, box-shadow .08s, opacity .3s;
  }
  .key[data-dir="up"] { grid-area: up; }
  .key[data-dir="left"] { grid-area: left; }
  .key[data-dir="down"] { grid-area: down; }
  .key[data-dir="right"] { grid-area: right; }
  .key.on { background: var(--key-on); transform: translateY(.6vw); box-shadow: 0 .1vw 0 var(--key-edge); }
  .key.off { opacity: .25; }
  .key.hint { animation: hint 1s ease-in-out infinite; }

  /* ---------- Start screen ---------- */
  #start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
    background: var(--sky);
  }
  #start h1 { font-size: 9vh; margin: 0; }
  #start button {
    font: inherit; font-size: 7vh; font-weight: bold;
    padding: 2vh 7vh; border: none; border-radius: 5vh;
    background: var(--pink); color: #fff; cursor: pointer;
    box-shadow: 0 1vh 0 var(--pink-dark);
  }
  #start p { font-size: 2.6vh; margin: 0; opacity: .7; text-align: center; max-width: 36em; padding: 0 16px; }

  /* ---------- Phones held upright ----------
     The keys move under the field, and sizes follow the screen width. */
  @media (orientation: portrait) {
    #sky { flex-basis: 17vh; }
    #sun { width: 14vw; height: 14vw; top: 2vh; box-shadow: 0 0 0 2vw #fff2a8; }
    #suncloud { left: 7vw; top: calc(2vh + 7vw); width: 19vw; }
    #music { left: 22vw; top: 3vh; width: 10vw; height: 10vw; font-size: 5vw; }
    #message { font-size: 6.5vw; margin-top: 5vh; padding: 0 2vw; }
    #stars { top: 1.5vh; font-size: 6vw; }
    #main { flex-direction: column; }
    #field { border-top-right-radius: 0; }
    #keys { flex: 0 0 auto; padding: 3vh 0 max(4vh, env(safe-area-inset-bottom)); }
    .pad {
      gap: 3vw;
      grid-template-columns: repeat(3, 20vw);
      grid-template-rows: repeat(2, 20vw);
    }
    .key { border-radius: 4vw; font-size: 10vw; box-shadow: 0 1.5vw 0 var(--key-edge); }
    .key.on { transform: translateY(1.2vw); }
    #start h1 { font-size: 10vw; }
    #start button { font-size: 9vw; padding: 2vh 10vw; }
    #start p { font-size: 4vw; padding: 0 6vw; }
  }

  @keyframes jump {
    0% { transform: translateY(0); }
    40% { transform: translateY(-45%) scale(1.05); }
    70% { transform: translateY(0) scale(1.1, .9); }
    100% { transform: translateY(0); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.4); } 100% { transform: scale(1); } }
  @keyframes hint {
    0%, 100% { background: var(--key); }
    50% { background: var(--key-on); transform: scale(1.12); }
  }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, .985); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes tailwag { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-7%); } }
  @keyframes swing { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(18deg); } }
  @keyframes wave { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(-35deg); } }
  @keyframes cheerBack { from { transform: rotate(0); } to { transform: rotate(40deg); } }
  @keyframes cheerFront { from { transform: rotate(0); } to { transform: rotate(-40deg); } }
  @keyframes lookup { 0%, 78%, 100% { transform: rotate(0); } 84%, 94% { transform: rotate(-9deg); } }
  @keyframes shimmer { 0%, 100% { opacity: .2; } 50% { opacity: .38; } }
  @keyframes twinkle {
    0% { transform: scale(0); opacity: 0; } 30% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(.8) translateY(-60%); opacity: 0; }
  }
  @keyframes squish {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(1.15, .8); }
    60% { transform: scale(.95, 1.05); }
  }
  @keyframes ripple {
    from { transform: scale(.4); opacity: .9; }
    to { transform: scale(1.35); opacity: 0; }
  }
  @keyframes arc {
    0% { transform: translate(0, 0); opacity: 1; animation-timing-function: ease-out; }
    45% { transform: translate(calc(var(--dx) * .6), var(--up)); animation-timing-function: ease-in; }
    100% { transform: translate(var(--dx), var(--fall)) scale(.5); opacity: 0; }
  }
</style>
</head>
<body>

<div id="start">
  <h1>🐷 Muddy Puddles</h1>
  <button id="play">▶ Play</button>
  <p>Use the arrow keys, or swipe on a phone or tablet, to take Peppa to the muddy puddle.
     Press Esc to leave full screen.</p>
</div>

<div id="game">
  <div id="sky">
    <div id="rainbow"></div>
    <div id="sun"></div>
    <button id="music" aria-label="Music on/off" tabindex="-1">🎵</button>
    <div id="message">Find the muddy puddle!</div>
    <div id="stars"></div>
  </div>
  <div id="main">
    <div id="field">
      <div id="rain"></div>
      <div id="puddle">
        <svg viewBox="0 0 200 100">
          <defs>
            <linearGradient id="sheen" x1="0" x2="1">
              <stop offset="0" stop-color="#ff9a9a"/><stop offset=".25" stop-color="#fff38a"/>
              <stop offset=".5" stop-color="#8fd694"/><stop offset=".75" stop-color="#7cc0ff"/>
              <stop offset="1" stop-color="#c39bff"/>
            </linearGradient>
          </defs>
          <g class="water">
            <ellipse class="mudpool" cx="100" cy="55" rx="95" ry="40" fill="var(--mud)"/>
            <ellipse cx="80" cy="45" rx="40" ry="10" fill="var(--mud-light)" opacity=".7"/>
            <ellipse class="sheen" cx="105" cy="52" rx="60" ry="14" fill="url(#sheen)"/>
          </g>
        </svg>
      </div>
      <div id="peppa">
        <div class="bounce"><div class="flip"><div class="alive">
          <svg viewBox="0 0 200 230">
            <g class="tail">
              <path d="M52 160 q-18 -4 -14 -16 q4 -10 12 -2 q6 8 -8 10" fill="none" stroke="var(--pink-dark)" stroke-width="5" stroke-linecap="round"/>
            </g>
            <g class="leg back">
              <line x1="82" y1="180" x2="82" y2="212" stroke="var(--pink-dark)" stroke-width="7" stroke-linecap="round"/>
              <ellipse cx="86" cy="216" rx="13" ry="7" fill="#222"/>
            </g>
            <g class="leg front">
              <line x1="118" y1="180" x2="118" y2="212" stroke="var(--pink-dark)" stroke-width="7" stroke-linecap="round"/>
              <ellipse cx="122" cy="216" rx="13" ry="7" fill="#222"/>
            </g>
            <g class="arm back">
              <line x1="68" y1="130" x2="40" y2="112" stroke="var(--pink-dark)" stroke-width="7" stroke-linecap="round"/>
            </g>
            <g class="arm front">
              <line x1="132" y1="130" x2="162" y2="112" stroke="var(--pink-dark)" stroke-width="7" stroke-linecap="round"/>
            </g>
            <path d="M72 108 L128 108 L156 184 Q100 196 44 184 Z" fill="var(--dress)" stroke="#b81d23" stroke-width="3" stroke-linejoin="round"/>
            <!-- mud spots, shown after a splash -->
            <g class="mud" fill="var(--mud)">
              <circle cx="66" cy="176" r="6"/><circle cx="84" cy="166" r="4"/><circle cx="128" cy="172" r="5"/>
              <circle cx="104" cy="182" r="3.5"/><circle cx="142" cy="178" r="3"/>
              <circle cx="80" cy="213" r="4"/><circle cx="127" cy="214" r="4.5"/>
            </g>
            <g class="head">
              <ellipse cx="66" cy="28" rx="10" ry="18" fill="var(--pink)" stroke="var(--pink-dark)" stroke-width="3" transform="rotate(-20 66 28)"/>
              <ellipse cx="90" cy="20" rx="10" ry="18" fill="var(--pink)" stroke="var(--pink-dark)" stroke-width="3" transform="rotate(5 90 20)"/>
              <ellipse cx="96" cy="72" rx="56" ry="42" fill="var(--pink)" stroke="var(--pink-dark)" stroke-width="3" transform="rotate(-18 96 72)"/>
              <ellipse cx="152" cy="42" rx="15" ry="21" fill="var(--pink)" stroke="var(--pink-dark)" stroke-width="3" transform="rotate(-18 152 42)"/>
              <circle cx="148" cy="38" r="3.5" fill="var(--pink-dark)"/>
              <circle cx="157" cy="46" r="3.5" fill="var(--pink-dark)"/>
              <g class="eyes">
                <circle cx="112" cy="48" r="9" fill="#fff" stroke="#222" stroke-width="2"/>
                <circle cx="132" cy="40" r="9" fill="#fff" stroke="#222" stroke-width="2"/>
                <circle cx="114" cy="48" r="4.5" fill="#222"/>
                <circle cx="134" cy="40" r="4.5" fill="#222"/>
              </g>
              <circle cx="74" cy="84" r="11" fill="var(--pink-dark)" opacity=".8"/>
              <path d="M104 88 Q122 100 140 80" fill="none" stroke="#b81d23" stroke-width="4" stroke-linecap="round"/>
            </g>
          </svg>
        </div></div></div>
      </div>
    </div>
    <div id="keys">
      <div class="pad">
        <button class="key" data-dir="up" aria-label="Up">▲</button>
        <button class="key" data-dir="left" aria-label="Left">◀</button>
        <button class="key" data-dir="down" aria-label="Down">▼</button>
        <button class="key" data-dir="right" aria-label="Right">▶</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const PUDDLES_PER_ROUND = 5;
  const HINT_AFTER_MS = 4000;
  const DIRS = {
    ArrowLeft:  { name: "left",  dx: -1, dy: 0 },
    ArrowRight: { name: "right", dx: 1,  dy: 0 },
    ArrowUp:    { name: "up",    dx: 0,  dy: -1 },
    ArrowDown:  { name: "down",  dx: 0,  dy: 1 },
  };
  const byName = Object.fromEntries(Object.values(DIRS).map(d => [d.name, d]));

  const $ = s => document.querySelector(s);
  const field = $("#field"), peppa = $("#peppa"), puddle = $("#puddle");
  const message = $("#message"), stars = $("#stars");

  // ---------- Weather ----------
  // One step after each puddle, so it changes with progress, never mid-thought.
  const WEATHER = ["sunny", "cloudy", "rain", "rainbow", "sunny"];
  function setWeather() {
    const w = WEATHER[state.score % WEATHER.length], changed = document.body.dataset.weather !== w;
    document.body.dataset.weather = w;
    if (!ctx || !changed) return;
    // Glide the music's brightness to suit the new weather.
    musicTone.frequency.setTargetAtTime(MOODS[w].cutoff, ctx.currentTime, 1.2);
    // The rainbow arrives with a soft harp-like run.
    if (w === "rainbow" && musicOn)
      [0, 4, 7, 12, 16, 19, 24, 28].forEach((n, i) =>
        note(hz(60 + musicKey + n), { dur: 0.9, vol: 0.05, at: 0.6 + i * 0.08, bus: musicBus }));
  }
  const CLOUD_SVG = `<svg viewBox="0 0 100 50"><g fill="#fff">
    <circle cx="30" cy="30" r="17"/><circle cx="54" cy="22" r="21"/><circle cx="76" cy="31" r="14"/>
    <rect x="18" y="30" width="70" height="18" rx="9"/></g></svg>`;
  (function buildWeather() {
    const sky = $("#sky");
    // [top, width, seconds to cross, extra = only when cloudy or raining]
    [[1, 13, 95, false], [6, 10, 120, false], [0, 16, 80, true], [5, 12, 105, true], [2, 14, 90, true]]
      .forEach(([top, width, secs, extra], i) => {
        const c = document.createElement("div");
        c.className = "cloud" + (extra ? " extra" : "");
        c.innerHTML = CLOUD_SVG;
        Object.assign(c.style, { top: top + "vh", width: width + "vh",
          animationDuration: secs + "s", animationDelay: -(secs * (i * 0.21 + 0.1)) + "s" });
        sky.append(c);
      });
    const sunCloud = document.createElement("div");
    sunCloud.id = "suncloud"; sunCloud.innerHTML = CLOUD_SVG;
    sky.append(sunCloud);
    const rain = $("#rain");
    for (let i = 0; i < 34; i++) {
      const d = document.createElement("div"), dur = 0.9 + Math.random() * 0.5;
      d.className = "raindrop";
      Object.assign(d.style, { left: Math.random() * 105 + "%",
        animationDuration: dur + "s", animationDelay: -Math.random() * dur + "s" });
      rain.append(d);
    }
  })();
  const keyEls = Object.fromEntries([...document.querySelectorAll(".key")].map(k => [k.dataset.dir, k]));

  // Level 1: one row, only left/right. Level 2: three rows, all four arrows.
  const state = { level: 1, cols: 5, rows: 1, x: 0, y: 0, px: 4, py: 0, score: 0, busy: false, started: false };
  let cell = 0, offX = 0, offY = 0, hintTimer = null, walkTimer = null;

  // ---------- Sound ----------
  // Everything goes through a gentle limiter so nothing gets loud or sharp.
  // Sound effects and music have separate volume knobs.
  const SFX_VOLUME = 0.5, MUSIC_VOLUME = 0.35, MUSIC_DUCKED = 0.12;
  let ctx = null, sfxBus, musicBus, musicTone;

  // The music's mood follows the weather: same song, different feel.
  //   tempo:  multiplies the beat length (bigger = slower)
  //   cutoff: brightness of the sound (lower = softer, more muffled)
  //   melody: melody volume
  //   bounce: off-beat chords while Peppa walks
  //   pad:    soft held chord under the song
  //   drops:  chance of a little "raindrop" plink on each half-beat
  //   sparkle: melody doubled an octave up, a little brighter
  const MOODS = {
    sunny:   { tempo: 1,    cutoff: 3500, melody: 1,    bounce: true,  pad: 0,     drops: 0,    sparkle: 0.02 },
    cloudy:  { tempo: 1.08, cutoff: 2200, melody: 0.85, bounce: true,  pad: 0.025, drops: 0,    sparkle: 0.01 },
    rain:    { tempo: 1.15, cutoff: 1500, melody: 0.8,  bounce: false, pad: 0.035, drops: 0.35, sparkle: 0 },
    rainbow: { tempo: 1,    cutoff: 3500, melody: 1,    bounce: true,  pad: 0,     drops: 0,    sparkle: 0.045 },
  };
  const mood = () => MOODS[document.body.dataset.weather] || MOODS.sunny;
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -18; limiter.ratio.value = 8;
      const soften = ctx.createBiquadFilter(); // take the edge off high frequencies
      soften.type = "lowpass"; soften.frequency.value = 3500;
      soften.connect(limiter).connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = SFX_VOLUME; sfxBus.connect(soften);
      // Music passes through its own tone control, so the weather can make it brighter or more muffled.
      musicTone = ctx.createBiquadFilter(); musicTone.type = "lowpass"; musicTone.frequency.value = MOODS.sunny.cutoff;
      musicBus = ctx.createGain(); musicBus.gain.value = MUSIC_VOLUME; musicBus.connect(musicTone).connect(soften);
    }
    if (ctx.state !== "running") ctx.resume();
    return ctx;
  }
  // A soft note: fades in quickly (no click) and fades out smoothly.
  function note(freq, { endFreq = freq, dur = 0.3, type = "sine", vol = 0.2, at = 0, bus = sfxBus } = {}) {
    const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq !== freq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(bus);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const hz = midi => 440 * 2 ** ((midi - 69) / 12);
  const sfx = {
    // Each direction plays its own soft chime.
    step: dir => note(hz(72 + musicKey + { left: 0, right: 4, up: 7, down: -5 }[dir]), { dur: 0.35, vol: 0.18 }),
    bump: () => note(220, { endFreq: 180, dur: 0.25, vol: 0.12 }),
    oink: () => [0, 0.2].forEach(at =>
      note(330, { endFreq: 240, dur: 0.16, type: "triangle", vol: 0.14, at })),
    // Splash = a soft "bloop" followed by a happy rising chime.
    splash: () => {
      const rain = document.body.dataset.weather === "rain";
      note(rain ? 320 : 400, { endFreq: rain ? 110 : 150, dur: rain ? 0.4 : 0.3, vol: 0.2 });
      [72, 76, 79, 84].forEach((m, i) => note(hz(m + musicKey), { dur: 0.5, vol: 0.13, at: 0.25 + i * 0.1 }));
    },
    // End of a round: a longer run up two octaves.
    fanfare: () => [60, 64, 67, 72, 76, 79, 84].forEach((m, i) =>
      note(hz(m + musicKey), { dur: i === 6 ? 1.2 : 0.4, vol: 0.12, at: i * 0.09 })),
  };

  // ---------- Background music ----------
  // An original tune built into the page, no audio files needed.
  let musicOn = true, musicTimer = null;

  // Original song in four 4-bar sections, played in a varied order.
  // Melody notes are semitones above the key's root (12 = middle of the tune), 0 = rest.
  // Each bar is a list of [note, beats] adding up to 4 beats.
  const SONG = {
    A: { chords: ["I", "IV", "I", "V"], bars: [
      [[12,1],[16,1],[19,1],[16,1]], [[17,1],[21,1],[19,2]],
      [[16,1],[19,1],[24,1],[19,1]], [[17,1],[14,1],[12,2]] ] },
    B: { chords: ["IV", "I", "V", "I"], bars: [
      [[21,1],[21,1],[19,1],[19,1]], [[17,1],[17,1],[16,2]],
      [[14,1],[16,1],[17,1],[14,1]], [[12,3],[0,1]] ] },
    C: { chords: ["vi", "IV", "I", "V"], bars: [
      [[16,.5],[16,.5],[19,1],[21,1],[19,1]], [[17,1],[16,.5],[14,.5],[12,2]],
      [[16,1],[19,1],[16,1],[12,1]], [[14,2],[19,2]] ] },
    D: { chords: ["I", "vi", "IV", "V"], bars: [
      [[24,2],[23,1],[21,1]], [[19,2],[16,2]],
      [[17,1],[19,1],[21,1],[17,1]], [[19,4]] ] },
  };
  const ORDER = ["A", "B", "A", "C", "D", "B"];
  const CHORDS = { I: [0, 4, 7], IV: [5, 9, 12], V: [7, 11, 14], vi: [9, 12, 16] };
  // Every muddy puddle moves the song (and the sound effects) to a new key.
  const KEYS = [0, 5, 2, -2];
  let musicKey = 0, keyIndex = 0, pendingKey = null;
  let beat = 0.42;                 // seconds per beat; a little quicker in level 2
  let lastMove = 0;                // when Peppa last moved, to tell "playing" from "waiting"
  let nextTime = 0, secIdx = 0, bar = 0, tick = 0; // tick = eighth note in the bar (0-7)
  let noiseBuf = null;

  function changeKey() { pendingKey = KEYS[++keyIndex % KEYS.length]; }

  function shaker(at) {
    const a = audio();
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, a.sampleRate * 0.06, a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3;
    }
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = 3000; g.gain.value = 0.08;
    src.connect(f).connect(g).connect(musicBus);
    src.start(a.currentTime + at);
  }

  function playTick(at) {
    if (tick === 0 && pendingKey !== null) { musicKey = pendingKey; pendingKey = null; }
    const sec = SONG[ORDER[secIdx]], chord = CHORDS[sec.chords[bar]];
    const root = 48 + musicKey, now = Date.now();
    const playing = now - lastMove < 3000, waiting = now - lastMove > 8000;
    const nearPuddle = !state.busy && Math.abs(state.px - state.x) + Math.abs(state.py - state.y) === 1;
    const m = { bus: musicBus, at }, md = mood();

    // Cloudy and rainy weather: a soft held chord underneath.
    if (md.pad && tick === 0)
      chord.forEach(c => note(hz(root + c), { ...m, dur: beat * md.tempo * 4, vol: md.pad }));

    // Bass: root on beat 1, fifth on beat 3.
    if (tick === 0) note(hz(root - 12 + chord[0]), { ...m, dur: beat * 1.8, type: "triangle", vol: 0.13 });
    if (tick === 4) note(hz(root - 12 + chord[0] + 7), { ...m, dur: beat * 1.8, type: "triangle", vol: 0.11 });

    // Melody (glockenspiel-ish). Softer while Eliot is thinking.
    let pos = 0;
    for (const [n, beats] of sec.bars[bar]) {
      if (pos * 2 === tick && n) {
        note(hz(root + n), { ...m, dur: 0.6, vol: (waiting ? 0.07 : 0.12) * md.melody });
        if (md.sparkle) note(hz(root + n) * 2, { ...m, dur: 0.3, vol: md.sparkle });
      }
      pos += beats;
    }

    // While Peppa is on the move: bouncy off-beat chords.
    if (md.bounce && playing && (tick === 2 || tick === 6))
      chord.forEach(c => note(hz(root + 12 + c), { ...m, dur: 0.18, type: "triangle", vol: 0.035 }));

    // Rain: the odd soft high "plink", like drops on a window.
    if (Math.random() < md.drops)
      note(hz(root + 24 + chord[Math.floor(Math.random() * 3)]), { ...m, dur: 0.15, vol: 0.025 });

    // One step from the puddle: a twinkly rising arpeggio to build excitement.
    if (nearPuddle)
      note(hz(root + 24 + chord[tick % 3] + (tick >= 3 ? 12 : 0)), { ...m, dur: 0.2, vol: 0.035 });

    // Level 2: a soft beat joins in.
    if (state.level >= 2) {
      if (tick % 2 === 1) shaker(at);
      if (tick === 0 || tick === 4) note(110, { ...m, endFreq: 45, dur: 0.2, vol: 0.18 });
    }
  }

  function scheduleMusic() {
    const a = audio();
    while (nextTime < a.currentTime + 0.4) {
      playTick(Math.max(0, nextTime - a.currentTime));
      nextTime += beat * mood().tempo / 2;
      if (++tick === 8) {
        tick = 0;
        if (++bar === 4) { bar = 0; secIdx = (secIdx + 1) % ORDER.length; }
      }
    }
  }
  function startMusic() {
    if (!musicOn) return;
    audio();
    nextTime = ctx.currentTime + 0.1;
    clearInterval(musicTimer);
    musicTimer = setInterval(scheduleMusic, 100);
  }
  function stopMusic() {
    clearInterval(musicTimer);
  }
  function setMusicLevel(level) {
    if (musicBus) musicBus.gain.setTargetAtTime(level, ctx.currentTime, 0.15);
  }

  // Music gets quieter while the voice is talking.
  function say(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9; u.pitch = 1.3;
    u.onstart = () => setMusicLevel(MUSIC_DUCKED);
    u.onend = () => setMusicLevel(MUSIC_VOLUME);
    speechSynthesis.speak(u);
  }

  // ---------- Layout ----------
  function place(el, x, y, scale) {
    const size = cell * scale;
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.left = offX + x * cell + (cell - size) / 2 + "px";
    el.style.top = offY + y * cell + (cell - size) / 2 + "px";
  }
  function layout() {
    const w = field.clientWidth, h = field.clientHeight;
    cell = Math.min(w / state.cols, h / state.rows);
    offX = (w - cell * state.cols) / 2;
    offY = (h - cell * state.rows) / 2;
    field.querySelectorAll(".tile").forEach(t => t.remove());
    for (let y = 0; y < state.rows; y++)
      for (let x = 0; x < state.cols; x++) {
        const t = document.createElement("div");
        t.className = "tile";
        field.prepend(t);
        place(t, x, y, 0.8);
      }
    peppa.style.transition = "none";
    place(peppa, state.x, state.y, 0.85);
    place(puddle, state.px, state.py, 0.9);
    peppa.offsetWidth; // flush so the next move animates
    peppa.style.transition = "";
    keyEls.up.classList.toggle("off", state.rows === 1);
    keyEls.down.classList.toggle("off", state.rows === 1);
  }

  // ---------- Game ----------
  function newPuddle() {
    let px, py;
    do {
      px = Math.floor(Math.random() * state.cols);
      py = Math.floor(Math.random() * state.rows);
    } while (Math.abs(px - state.x) + Math.abs(py - state.y) < 2);
    state.px = px; state.py = py;
    place(puddle, px, py, 0.9);
    puddle.style.opacity = 1;
    peppa.classList.remove("muddy"); // the mud slowly fades
    message.textContent = "Find the muddy puddle!";
    resetHint();
  }

  function flash(dir) {
    const k = keyEls[dir];
    k.classList.add("on");
    setTimeout(() => k.classList.remove("on"), 150);
  }

  function move(d) {
    if (state.busy) return;
    flash(d.name);
    resetHint();
    wrongPresses = 0;
    lastMove = Date.now();
    if (d.dx) peppa.classList.toggle("left", d.dx < 0);
    const nx = state.x + d.dx, ny = state.y + d.dy;
    if (nx < 0 || ny < 0 || nx >= state.cols || ny >= state.rows) {
      sfx.bump();
      replay(peppa, "bump");
      return;
    }
    state.x = nx; state.y = ny;
    place(peppa, nx, ny, 0.85);
    replay(peppa, "walking");
    clearTimeout(walkTimer);
    walkTimer = setTimeout(() => peppa.classList.remove("walking"), 400); // back to breathing
    peppa.classList.remove("pointing");
    sfx.step(d.name);
    say(d.name);
    if (nx === state.px && ny === state.py) setTimeout(splash, 350);
  }

  function replay(el, cls) {
    el.classList.remove(cls);
    el.offsetWidth;
    el.classList.add(cls);
  }

  function splash() {
    state.busy = true;
    clearHint();
    replay(peppa, "jump");
    // Peppa lands back in the puddle about 0.4s into her jump: splash then.
    setTimeout(() => { sfx.splash(); splashEffect(); }, 400);
    setTimeout(sfx.oink, 700);
    say("Muddy puddle! Hooray!");
    message.textContent = "Splash! Hooray! 🎉";
    state.score++;
    changeKey();
    const s = document.createElement("span");
    s.className = "star"; s.textContent = "⭐";
    stars.append(s);

    setTimeout(() => {
      puddle.style.opacity = 0;
      setWeather();
      if (state.score % PUDDLES_PER_ROUND === 0) roundDone();
      else { newPuddle(); state.busy = false; }
    }, 1800);
  }

  function roundDone() {
    sfx.fanfare();
    stars.textContent = "";
    if (state.level === 1) {
      state.level = 2; state.rows = 3;
      beat = 0.38;
      state.y = 1; state.py = 1;
      message.textContent = "Now up ▲ and down ▼ too!";
      say("Well done! Now you can go up and down too!");
    } else {
      message.textContent = "Well done! 🌈";
      say("Well done!");
    }
    layout();
    setTimeout(() => { newPuddle(); state.busy = false; }, 2500);
  }

  function spawnAt(cls, w, h, x, y, life) {
    const el = document.createElement("div");
    el.className = cls;
    Object.assign(el.style, { width: w + "px", height: h + "px", left: x - w / 2 + "px", top: y - h / 2 + "px" });
    field.append(el);
    setTimeout(() => el.remove(), life);
    return el;
  }

  // The splash suits the weather: sunny is the plain splash, cloudy a little
  // bigger, rain the biggest and wettest, and after rain some drops twinkle.
  const SPLASH = {
    sunny:   { drops: 10, height: 1,    spread: 1,   ripples: 2 },
    cloudy:  { drops: 13, height: 1.1,  spread: 1.1, ripples: 2 },
    rain:    { drops: 18, height: 1.45, spread: 1.3, ripples: 3, wet: true },
    rainbow: { drops: 10, height: 1.1,  spread: 1,   ripples: 2, rainbow: true },
  };
  const RAINBOW = ["#ff9a9a", "#ffc27a", "#fff38a", "#8fd694", "#7cc0ff", "#c39bff"];

  function splashEffect() {
    const kind = SPLASH[document.body.dataset.weather] || SPLASH.sunny;
    const r = puddle.getBoundingClientRect(), f = field.getBoundingClientRect();
    const cx = r.left - f.left + r.width / 2, cy = r.top - f.top + r.height * 0.55;
    replay(puddle, "squish");
    peppa.classList.add("muddy");
    replay(peppa, "cheer");
    // Soft ripples, one just after the other.
    for (let i = 0; i < kind.ripples; i++) setTimeout(() =>
      spawnAt("ripple", r.width * 0.9 * kind.spread, r.height * 0.45 * kind.spread, cx, cy, 1000), i * 180);
    // A crown of mud drops that arc up and fall back down.
    for (let i = 0; i < kind.drops; i++) {
      const size = cell * (0.04 + Math.random() * 0.05);
      const side = i % 2 ? 1 : -1;
      const d = spawnAt("drop", size, size, cx + side * r.width * 0.2, cy, 800);
      if (kind.wet && i % 3 === 0) d.classList.add("wet");
      if (kind.rainbow && i % 2 === 0) {
        d.classList.add("rainbow");
        d.style.background = d.style.color = RAINBOW[(i / 2) % RAINBOW.length];
      }
      d.style.setProperty("--dx", side * cell * (0.15 + Math.random() * 0.35) * kind.spread + "px");
      d.style.setProperty("--up", -cell * (0.25 + Math.random() * 0.3) * kind.height + "px");
      d.style.setProperty("--fall", cell * 0.05 + "px");
    }
    if (kind.rainbow)
      for (let i = 0; i < 3; i++) setTimeout(() => {
        const t = spawnAt("twinkle", cell * 0.18, cell * 0.18,
          cx + (Math.random() - 0.5) * r.width, cy - r.height * (0.4 + Math.random() * 0.6), 900);
        t.style.fontSize = cell * 0.16 + "px";
        t.textContent = "✨";
      }, 150 + i * 150);
  }

  // While it rains, tiny raindrop rings appear on the puddle's surface.
  setInterval(() => {
    if (!state.started || state.busy || document.body.dataset.weather !== "rain") return;
    const r = puddle.getBoundingClientRect(), f = field.getBoundingClientRect(), size = r.width * 0.12;
    spawnAt("rainring", size, size * 0.45,
      r.left - f.left + r.width * (0.2 + Math.random() * 0.6),
      r.top - f.top + r.height * (0.4 + Math.random() * 0.3), 700);
  }, 450);



  // ---------- Hints: glow the arrow that points toward the puddle ----------
  function hintDir() {
    return state.px !== state.x
      ? (state.px < state.x ? "left" : "right")
      : (state.py < state.y ? "up" : "down");
  }
  function showHint() {
    if (state.busy) return;
    const dir = hintDir();
    keyEls[dir].classList.add("hint");
    // Peppa helps too: she turns toward the puddle and waves at it.
    if (dir === "left" || dir === "right") peppa.classList.toggle("left", dir === "left");
    peppa.classList.add("pointing");
  }
  function clearHint() {
    peppa.classList.remove("pointing");
    clearTimeout(hintTimer);
    Object.values(keyEls).forEach(k => k.classList.remove("hint"));
  }
  function resetHint() {
    clearHint();
    hintTimer = setTimeout(showHint, HINT_AFTER_MS);
  }

  // A key that isn't an arrow: glow the right arrow straight away, and only
  // after a few misses in a row let the voice say something (not too often).
  const NUDGE_AFTER = 3, NUDGE_GAP_MS = 8000;
  const NUDGES = [
    d => `Try the ${d} arrow!`,
    d => `Where's the ${d} arrow?`,
    d => `Peppa wants to go ${d}!`,
  ];
  let wrongPresses = 0, lastNudge = 0, nudgeIndex = 0;
  function nudge() {
    if (state.busy) return;
    showHint();
    wrongPresses++;
    if (wrongPresses < NUDGE_AFTER || Date.now() - lastNudge < NUDGE_GAP_MS) return;
    wrongPresses = 0;
    lastNudge = Date.now();
    say(NUDGES[nudgeIndex++ % NUDGES.length](hintDir()));
  }

  // ---------- Input ----------
  document.addEventListener("keydown", e => {
    if (!state.started) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey || e.key === "Escape") return;
    e.preventDefault();
    if (e.repeat) return; // holding a key down shouldn't zoom Peppa across the field
    const d = DIRS[e.key];
    if (d) {
      go(d);
    } else if (e.key === " ") {
      if (!state.busy) { replay(peppa, "jump"); sfx.oink(); }
    } else {
      nudge();
    }
  });
  // An arrow key or a swipe. Up/down in level 1 counts as a wrong move.
  function go(d) {
    if (d.dy && state.rows === 1) { flash(d.name); nudge(); return; }
    move(d);
  }

  // Swipes on phones and tablets: a quick drag anywhere (except on the
  // on-screen buttons) moves Peppa in the drag's main direction.
  const SWIPE_MIN = 30; // px
  let swipeStart = null;
  document.addEventListener("pointerdown", e => {
    if (!state.started || e.target.closest(".key, #music")) return;
    swipeStart = { x: e.clientX, y: e.clientY };
  });
  document.addEventListener("pointerup", e => {
    if (!swipeStart) return;
    const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
    swipeStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return; // a tap, not a swipe
    go(byName[Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up")]);
  });
  document.addEventListener("pointercancel", () => { swipeStart = null; });

  Object.entries(keyEls).forEach(([name, k]) =>
    k.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (state.started && !(byName[name].dy && state.rows === 1)) move(byName[name]);
    }));

  // Phones: play sound even when an iPhone's silent switch is on, like video
  // and music apps do. Newer iPhones have a setting for this; older ones switch
  // over once a (silent) audio element is playing. Must run during a tap or click.
  function unlockPhoneAudio() {
    try { if (navigator.audioSession) { navigator.audioSession.type = "playback"; return; } } catch {}
    const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (!iOS || unlockPhoneAudio.done) return;
    unlockPhoneAudio.done = true;
    const rate = 8000, len = rate / 10, buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
    const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    str(0, "RIFF"); v.setUint32(4, 36 + len * 2, true); str(8, "WAVEfmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, len * 2, true);
    const el = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
    el.loop = true; el.setAttribute("playsinline", "");
    el.play().catch(() => {});
  }
  // Phones pause sound when the app is switched away or interrupted; any later
  // tap or key wakes it up again.
  const wakeAudio = () => { if (ctx && ctx.state !== "running") ctx.resume(); };
  ["pointerup", "keydown"].forEach(t => document.addEventListener(t, wakeAudio));

  function start() {
    if (state.started) return;
    state.started = true;
    unlockPhoneAudio();
    audio();
    $("#start").remove();
    document.documentElement.requestFullscreen?.().catch(() => {});
    layout();
    startMusic();
    say("Help Peppa find the muddy puddle!");
    resetHint();
  }
  $("#play").addEventListener("click", start);
  $("#music").addEventListener("click", e => {
    musicOn = !musicOn;
    e.currentTarget.classList.toggle("muted", !musicOn);
    musicOn ? startMusic() : stopMusic();
  });
  window.addEventListener("resize", layout);
  setWeather();
  layout();
})();
</script>
</body>
</html>
